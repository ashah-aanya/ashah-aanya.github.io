<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gallery — Aanya Shah</title>
<meta name="description" content="A walk-through first-person gallery of Aanya Shah's oil paintings." />
<link rel="stylesheet" href="css/styles.css" />
<style>
  html,body{margin:0; height:100%; overflow:hidden; background:#d9d5cc}
  #gl{display:block; position:fixed; inset:0}
  .cross{position:fixed; left:50%; top:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
    border-radius:50%; background:rgba(34,29,22,.45); z-index:4; pointer-events:none; display:none}
  .title{position:fixed; bottom:34px; left:50%; transform:translateX(-50%); z-index:4;
    font-family:var(--serif); font-style:italic; font-size:20px; color:#221d16; pointer-events:none;
    text-shadow:0 1px 12px rgba(240,238,232,.9); min-height:1.4em}
  .overlay{position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; cursor:pointer;
    background:rgba(238,236,230,.8); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px)}
  .overlay.hidden{display:none}
  .overlay h1{font-family:var(--serif); font-weight:500; font-size:clamp(34px,7vw,58px);
    letter-spacing:-.015em; margin:0; color:#211c15}
  .overlay h1 em{font-style:italic; color:var(--oxblood)}
  .overlay .sub{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); margin:14px 0 26px}
  .overlay .enter{font-family:var(--mono); font-size:14px; color:#fff; background:var(--oxblood);
    padding:12px 22px; border-radius:4px; letter-spacing:.02em}
  .overlay .keys{margin:26px 0 0; font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); line-height:1.9}
  .overlay .keys b{color:var(--ink)}
  .leave{position:fixed; top:20px; left:24px; z-index:6; font-family:var(--mono); font-size:12px;
    color:var(--oxblood); text-decoration:none; border-bottom:1px solid rgba(138,43,34,.4); display:none}
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="cross" id="cross"></div>
  <div class="title" id="title"></div>
  <a class="leave" id="leave" href="art.html">&larr; leave the gallery</a>
  <div class="overlay" id="overlay">
    <h1>Aanya <em>Shah</em></h1>
    <div class="sub">Studio &middot; walk-through gallery</div>
    <div class="enter">click to walk in</div>
    <div class="keys"><b>W A S D</b> or <b>arrow keys</b> to move &middot; <b>mouse</b> to look &middot; <b>Esc</b> to exit</div>
  </div>

<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/PointerLockControls.js"></script>
<script>
(function(){
  var ART=[
    ['restless','Restless'],['overwhelm','Overwhelm'],['floating','Floating'],
    ['conversations-with-myself','Conversations with Myself'],['shaping','Shaping'],
    ['before-the-destination','Before the Destination'],['detach','Detach'],
    ['evolving','Evolving'],['distorting','Distorting'],['space','Space']
  ];
  var HALF=12, ZBACK=-32, ZFRONT=4, HTALL=7, LEN=ZFRONT-ZBACK, MIDZ=(ZFRONT+ZBACK)/2, W=HALF*2;

  var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'), antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding=THREE.sRGBEncoding;
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;

  var scene=new THREE.Scene();
  scene.background=new THREE.Color(0xeeece6);
  var camera=new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 200);
  var maxAniso=renderer.capabilities.getMaxAnisotropy();

  // ---- lighting: soft fill + one shadow-casting key light + per-piece spots ----
  scene.add(new THREE.AmbientLight(0xffffff, 0.32));
  scene.add(new THREE.HemisphereLight(0xffffff, 0xe7e4dc, 0.5));
  var key=new THREE.DirectionalLight(0xffffff, 0.55);
  key.position.set(7, 17, 6); key.target.position.set(0,0,MIDZ);
  key.castShadow=true; key.shadow.mapSize.set(2048,2048);
  var sc=key.shadow.camera; sc.left=-16; sc.right=16; sc.top=22; sc.bottom=-22; sc.near=1; sc.far=44;
  key.shadow.bias=-0.0004;
  scene.add(key); scene.add(key.target);

  // ---- room ----
  var wallMat=new THREE.MeshStandardMaterial({color:0xf4f2ee, roughness:0.97, metalness:0, side:THREE.DoubleSide});
  var floorMat=new THREE.MeshStandardMaterial({color:0xe6e2da, roughness:0.75, metalness:0.02});
  var ceilMat=new THREE.MeshStandardMaterial({color:0xf8f7f4, roughness:1, metalness:0});
  function plane(mat,w,h){ return new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat); }
  var floor=plane(floorMat,W,LEN); floor.rotation.x=-Math.PI/2; floor.position.set(0,0,MIDZ); floor.receiveShadow=true; scene.add(floor);
  var ceil=plane(ceilMat,W,LEN); ceil.rotation.x=Math.PI/2; ceil.position.set(0,HTALL,MIDZ); scene.add(ceil);
  function wall(w,x,z,ry){ var m=plane(wallMat,w,HTALL); m.position.set(x,HTALL/2,z); m.rotation.y=ry; m.receiveShadow=true; scene.add(m); return m; }
  wall(W,0,ZBACK,0); wall(W,0,ZFRONT,Math.PI); wall(LEN,-HALF,MIDZ,Math.PI/2); wall(LEN,HALF,MIDZ,-Math.PI/2);

  // baseboards
  var baseMat=new THREE.MeshStandardMaterial({color:0xdedad0, roughness:1});
  function base(w,x,z,ry){ var m=new THREE.Mesh(new THREE.BoxGeometry(w,0.14,0.05), baseMat); m.position.set(x,0.07,z); m.rotation.y=ry; m.receiveShadow=true; scene.add(m); }
  base(W,0,ZBACK+0.03,0); base(LEN,-HALF+0.03,MIDZ,Math.PI/2); base(LEN,HALF-0.03,MIDZ,Math.PI/2);

  // benches down the aisle
  var benchMat=new THREE.MeshStandardMaterial({color:0xdedacf, roughness:0.85});
  var legMat=new THREE.MeshStandardMaterial({color:0x3a3630, roughness:0.5, metalness:0.2});
  function bench(z){
    var seat=new THREE.Mesh(new THREE.BoxGeometry(2.6,0.22,0.72), benchMat);
    seat.position.set(0,0.5,z); seat.castShadow=true; seat.receiveShadow=true; scene.add(seat);
    [-1.15,1.15].forEach(function(dx){ var l=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.4,0.6),legMat);
      l.position.set(dx,0.2,z); l.castShadow=true; scene.add(l); });
  }
  bench(-9); bench(-22);

  // ---- text label plaques ----
  function labelTex(title){
    var c=document.createElement('canvas'); c.width=512; c.height=224;
    var x=c.getContext('2d'); x.fillStyle='#f4f2ee'; x.fillRect(0,0,512,224);
    x.fillStyle='#221d16'; x.textBaseline='top'; x.font='600 42px Georgia, serif'; x.fillText(title,20,54);
    x.fillStyle='#6b6250'; x.font='26px monospace'; x.fillText('Aanya Shah  |  oil on canvas',20,132);
    var t=new THREE.CanvasTexture(c); t.encoding=THREE.sRGBEncoding; t.anisotropy=maxAniso; return t;
  }

  // ---- paintings as protruding boxes, each with a spotlight + label ----
  var loader=new THREE.TextureLoader(), paintings=[], PY=2.7, DEPTH=0.08;
  var edgeMat=new THREE.MeshStandardMaterial({color:0xf2eee6, roughness:0.9});
  var placement=[
    [-HALF, PY, -6,  Math.PI/2], [ HALF, PY, -6, -Math.PI/2],
    [-HALF, PY, -13, Math.PI/2], [ HALF, PY, -13,-Math.PI/2],
    [-HALF, PY, -20, Math.PI/2], [ HALF, PY, -20,-Math.PI/2],
    [-HALF, PY, -27, Math.PI/2], [ HALF, PY, -27,-Math.PI/2],
    [-5, PY, ZBACK, 0],          [ 5, PY, ZBACK, 0]
  ];
  ART.forEach(function(a,i){
    var p=placement[i];
    loader.load('assets/paintings/'+a[0]+'.jpg', function(tex){
      tex.encoding=THREE.sRGBEncoding; tex.anisotropy=maxAniso;
      var asp=tex.image.width/tex.image.height, H=2.3, Wd=H*asp;
      var faceMat=new THREE.MeshStandardMaterial({map:tex, roughness:0.55, metalness:0});
      var mats=[edgeMat,edgeMat,edgeMat,edgeMat,faceMat,edgeMat]; // +z face = image
      var box=new THREE.Mesh(new THREE.BoxGeometry(Wd,H,DEPTH), mats);
      box.castShadow=true; box.receiveShadow=true; box.position.z=DEPTH/2; box.userData.title=a[1];
      var g=new THREE.Group(); g.add(box);
      // label to the lower-right, on the wall
      var lab=new THREE.Mesh(new THREE.PlaneGeometry(0.66,0.29), new THREE.MeshBasicMaterial({map:labelTex(a[1]), toneMapped:false}));
      lab.position.set(Wd/2+0.5, -0.75, 0.02); g.add(lab);
      g.position.set(p[0],p[1],p[2]); g.rotation.y=p[3];
      scene.add(g); paintings.push(box);
      // spotlight aimed at the piece
      var nx=Math.sin(p[3]), nz=Math.cos(p[3]);
      var spot=new THREE.SpotLight(0xfff3e2, 3.0, 16, 0.5, 0.55, 1.2);
      spot.position.set(p[0]+nx*2.6, p[1]+2.9, p[2]+nz*2.6);
      spot.target.position.set(p[0]+nx*0.2, p[1], p[2]+nz*0.2);
      scene.add(spot); scene.add(spot.target);
      // ceiling track fixture at the spotlight origin
      var fix=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.1,0.22,12), legMat);
      fix.position.set(p[0]+nx*2.6, HTALL-0.12, p[2]+nz*2.6); scene.add(fix);
    });
  });

  // ---- controls ----
  var controls=new THREE.PointerLockControls(camera, renderer.domElement);
  controls.getObject().position.set(0,1.65,1); scene.add(controls.getObject());
  var overlay=document.getElementById('overlay'), cross=document.getElementById('cross'),
      titleEl=document.getElementById('title'), leave=document.getElementById('leave');
  overlay.addEventListener('click', function(){ controls.lock(); });
  controls.addEventListener('lock', function(){ overlay.classList.add('hidden'); cross.style.display='block'; leave.style.display='block'; });
  controls.addEventListener('unlock', function(){ overlay.classList.remove('hidden'); cross.style.display='none'; leave.style.display='none'; titleEl.textContent=''; });

  var move={f:false,b:false,l:false,r:false};
  function key2(e,v){
    switch(e.code){
      case 'KeyW': case 'ArrowUp': move.f=v; break;
      case 'KeyS': case 'ArrowDown': move.b=v; break;
      case 'KeyA': case 'ArrowLeft': move.l=v; break;
      case 'KeyD': case 'ArrowRight': move.r=v; break;
    }
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>-1) e.preventDefault();
  }
  document.addEventListener('keydown', function(e){ key2(e,true); });
  document.addEventListener('keyup', function(e){ key2(e,false); });

  var velocity=new THREE.Vector3(), direction=new THREE.Vector3(), clock=new THREE.Clock(), ray=new THREE.Raycaster();
  function animate(){
    requestAnimationFrame(animate);
    var dt=Math.min(clock.getDelta(),0.05);
    velocity.x-=velocity.x*8*dt; velocity.z-=velocity.z*8*dt;
    direction.z=Number(move.f)-Number(move.b); direction.x=Number(move.r)-Number(move.l); direction.normalize();
    var SPEED=48;
    if(move.f||move.b) velocity.z-=direction.z*SPEED*dt;
    if(move.l||move.r) velocity.x-=direction.x*SPEED*dt;
    if(controls.isLocked){
      controls.moveRight(-velocity.x*dt); controls.moveForward(-velocity.z*dt);
      var o=controls.getObject();
      o.position.x=Math.max(-HALF+0.7,Math.min(HALF-0.7,o.position.x));
      o.position.z=Math.max(ZBACK+0.7,Math.min(ZFRONT-0.7,o.position.z));
      o.position.y=1.65;
      ray.setFromCamera({x:0,y:0},camera);
      var hits=ray.intersectObjects(paintings);
      titleEl.textContent=(hits.length && hits[0].distance<9)?hits[0].object.userData.title:'';
    }
    renderer.render(scene,camera);
  }
  animate();
  window.addEventListener('resize', function(){
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);
  });
})();
</script>
</body>
</html>
