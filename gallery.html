<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gallery — Aanya Shah</title>
<meta name="description" content="A walk-through first-person gallery of Aanya Shah's oil paintings." />
<link rel="stylesheet" href="css/styles.css" />
<style>
  html,body{margin:0; height:100%; overflow:hidden; background:#eceae4}
  #gl{display:block; position:fixed; inset:0}

  /* crosshair + title readout */
  .cross{position:fixed; left:50%; top:50%; width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
    border-radius:50%; background:rgba(34,29,22,.5); z-index:4; pointer-events:none; display:none}
  .title{position:fixed; bottom:34px; left:50%; transform:translateX(-50%); z-index:4;
    font-family:var(--serif); font-style:italic; font-size:20px; color:#221d16; pointer-events:none;
    text-shadow:0 1px 10px rgba(236,234,228,.9); min-height:1.4em}

  /* enter / instructions overlay */
  .overlay{position:fixed; inset:0; z-index:10; display:flex; flex-direction:column;
    align-items:center; justify-content:center; text-align:center; cursor:pointer;
    background:rgba(240,238,232,.78); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px)}
  .overlay.hidden{display:none}
  .overlay h1{font-family:var(--serif); font-weight:500; font-size:clamp(34px,7vw,58px);
    letter-spacing:-.015em; margin:0; color:#211c15}
  .overlay h1 em{font-style:italic; color:var(--oxblood)}
  .overlay .sub{font-family:var(--mono); font-size:12px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--muted); margin:14px 0 26px}
  .overlay .enter{font-family:var(--mono); font-size:14px; color:#fff; background:var(--oxblood);
    padding:12px 22px; border-radius:4px; letter-spacing:.02em}
  .overlay .keys{margin:26px 0 0; font-family:var(--mono); font-size:12.5px; color:var(--ink-soft); line-height:1.9}
  .overlay .keys b{color:var(--ink)}
  .leave{position:fixed; top:20px; left:24px; z-index:6; font-family:var(--mono); font-size:12px;
    color:var(--oxblood); text-decoration:none; border-bottom:1px solid rgba(138,43,34,.4); display:none}
</style>
</head>
<body>
  <canvas id="gl"></canvas>
  <div class="cross" id="cross"></div>
  <div class="title" id="title"></div>
  <a class="leave" id="leave" href="art.html">&larr; leave the gallery</a>

  <div class="overlay" id="overlay">
    <h1>Aanya <em>Shah</em></h1>
    <div class="sub">Studio &middot; walk-through gallery</div>
    <div class="enter">click to walk in</div>
    <div class="keys"><b>W A S D</b> or <b>arrow keys</b> to move &middot; <b>mouse</b> to look &middot; <b>Esc</b> to exit</div>
  </div>

<script src="js/vendor/three.min.js"></script>
<script src="js/vendor/PointerLockControls.js"></script>
<script>
(function(){
  var ART=[
    ['restless','Restless'],['overwhelm','Overwhelm'],['floating','Floating'],
    ['conversations-with-myself','Conversations with Myself'],['shaping','Shaping'],
    ['before-the-destination','Before the Destination'],['detach','Detach'],
    ['evolving','Evolving'],['distorting','Distorting'],['space','Space']
  ];
  var HALF=12, ZBACK=-32, ZFRONT=4, HTALL=7;

  var renderer=new THREE.WebGLRenderer({canvas:document.getElementById('gl'), antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding=THREE.sRGBEncoding;

  var scene=new THREE.Scene();
  scene.background=new THREE.Color(0xf1efe9);
  var camera=new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 200);

  // clean gallery lighting
  scene.add(new THREE.HemisphereLight(0xffffff, 0xebe9e2, 1.0));
  scene.add(new THREE.AmbientLight(0xffffff, 0.45));
  var dir=new THREE.DirectionalLight(0xffffff, 0.35); dir.position.set(6,14,4); scene.add(dir);

  // room
  var wallMat=new THREE.MeshStandardMaterial({color:0xf4f2ee, roughness:0.96, metalness:0, side:THREE.DoubleSide});
  var floorMat=new THREE.MeshStandardMaterial({color:0xe7e3db, roughness:1, metalness:0});
  var ceilMat=new THREE.MeshStandardMaterial({color:0xfafaf7, roughness:1, metalness:0});
  var LEN=ZFRONT-ZBACK, MIDZ=(ZFRONT+ZBACK)/2, W=HALF*2;
  function plane(mat, w, h){ return new THREE.Mesh(new THREE.PlaneGeometry(w,h), mat); }
  var floor=plane(floorMat, W, LEN); floor.rotation.x=-Math.PI/2; floor.position.set(0,0,MIDZ); scene.add(floor);
  var ceil=plane(ceilMat, W, LEN); ceil.rotation.x=Math.PI/2; ceil.position.set(0,HTALL,MIDZ); scene.add(ceil);
  var back=plane(wallMat, W, HTALL); back.position.set(0,HTALL/2,ZBACK); scene.add(back);
  var front=plane(wallMat, W, HTALL); front.rotation.y=Math.PI; front.position.set(0,HTALL/2,ZFRONT); scene.add(front);
  var left=plane(wallMat, LEN, HTALL); left.rotation.y=Math.PI/2; left.position.set(-HALF,HTALL/2,MIDZ); scene.add(left);
  var right=plane(wallMat, LEN, HTALL); right.rotation.y=-Math.PI/2; right.position.set(HALF,HTALL/2,MIDZ); scene.add(right);

  // paintings placed around the room
  var loader=new THREE.TextureLoader(), paintings=[];
  var maxAniso=renderer.capabilities.getMaxAnisotropy();
  var PY=2.7;
  var placement=[
    [-HALF+0.06, PY, -6,  Math.PI/2],  [ HALF-0.06, PY, -6, -Math.PI/2],
    [-HALF+0.06, PY, -13, Math.PI/2],  [ HALF-0.06, PY, -13,-Math.PI/2],
    [-HALF+0.06, PY, -20, Math.PI/2],  [ HALF-0.06, PY, -20,-Math.PI/2],
    [-HALF+0.06, PY, -27, Math.PI/2],  [ HALF-0.06, PY, -27,-Math.PI/2],
    [-5, PY, ZBACK+0.06, 0],           [ 5, PY, ZBACK+0.06, 0]
  ];
  ART.forEach(function(a,i){
    var p=placement[i];
    loader.load('assets/paintings/'+a[0]+'.jpg', function(tex){
      tex.encoding=THREE.sRGBEncoding; tex.anisotropy=maxAniso;
      var asp=tex.image.width/tex.image.height, H=2.4, Wd=H*asp;
      var g=new THREE.Group();
      var frame=new THREE.Mesh(new THREE.PlaneGeometry(Wd+0.16,H+0.16), new THREE.MeshBasicMaterial({color:0x17140f, toneMapped:false}));
      frame.position.z=-0.015;
      var img=new THREE.Mesh(new THREE.PlaneGeometry(Wd,H), new THREE.MeshBasicMaterial({map:tex, toneMapped:false}));
      img.userData.title=a[1];
      g.add(frame); g.add(img);
      g.position.set(p[0],p[1],p[2]); g.rotation.y=p[3];
      scene.add(g); paintings.push(img);
    });
  });

  // controls
  var controls=new THREE.PointerLockControls(camera, renderer.domElement);
  controls.getObject().position.set(0,1.65,1);
  scene.add(controls.getObject());
  var overlay=document.getElementById('overlay'), cross=document.getElementById('cross'),
      titleEl=document.getElementById('title'), leave=document.getElementById('leave');
  overlay.addEventListener('click', function(){ controls.lock(); });
  controls.addEventListener('lock', function(){ overlay.classList.add('hidden'); cross.style.display='block'; leave.style.display='block'; });
  controls.addEventListener('unlock', function(){ overlay.classList.remove('hidden'); cross.style.display='none'; leave.style.display='none'; titleEl.textContent=''; });

  var move={f:false,b:false,l:false,r:false};
  function key(e,v){
    switch(e.code){
      case 'KeyW': case 'ArrowUp': move.f=v; break;
      case 'KeyS': case 'ArrowDown': move.b=v; break;
      case 'KeyA': case 'ArrowLeft': move.l=v; break;
      case 'KeyD': case 'ArrowRight': move.r=v; break;
    }
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].indexOf(e.code)>-1) e.preventDefault();
  }
  document.addEventListener('keydown', function(e){ key(e,true); }, false);
  document.addEventListener('keyup', function(e){ key(e,false); }, false);

  var velocity=new THREE.Vector3(), direction=new THREE.Vector3(), clock=new THREE.Clock();
  var ray=new THREE.Raycaster();
  function animate(){
    requestAnimationFrame(animate);
    var d=Math.min(clock.getDelta(), 0.05);
    velocity.x -= velocity.x*8*d; velocity.z -= velocity.z*8*d;
    direction.z=Number(move.f)-Number(move.b);
    direction.x=Number(move.r)-Number(move.l);
    direction.normalize();
    var SPEED=48;
    if(move.f||move.b) velocity.z -= direction.z*SPEED*d;
    if(move.l||move.r) velocity.x -= direction.x*SPEED*d;
    if(controls.isLocked){
      controls.moveRight(-velocity.x*d);
      controls.moveForward(-velocity.z*d);
      var o=controls.getObject();
      o.position.x=Math.max(-HALF+0.7, Math.min(HALF-0.7, o.position.x));
      o.position.z=Math.max(ZBACK+0.7, Math.min(ZFRONT-0.7, o.position.z));
      o.position.y=1.65;
      ray.setFromCamera({x:0,y:0}, camera);
      var hits=ray.intersectObjects(paintings);
      titleEl.textContent=(hits.length && hits[0].distance<9) ? hits[0].object.userData.title : '';
    }
    renderer.render(scene,camera);
  }
  animate();

  window.addEventListener('resize', function(){
    camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
</body>
</html>
